name: AgentTowerMobile
options:
  bundleIdPrefix: com.ar9av
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: NO
targets:
  AgentTowerMobile:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    sources:
      - path: AgentTowerMobile
    info:
      path: AgentTowerMobile/Info.plist
      properties:
        CFBundleDisplayName: AgentTower
        AgentTowerServerURL: $(AGENTTOWER_SERVER_URL)
        AgentTowerPassword: $(AGENTTOWER_PASSWORD)
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ar9av.AgentTowerMobile
        PRODUCT_NAME: AgentTower
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        DEVELOPMENT_ASSET_PATHS: "\"AgentTowerMobile/Preview Content\""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: []
